[package]
name = "cosmic-forge"
version = "0.11.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "Glass shader manager for the COSMIC desktop"
publish = false

[features]
default = ["gui"]
gui = ["dep:libcosmic"]

[[bin]]
name = "cosmic-forge"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
ron = "0.12"
sha2 = "0.11"
cosmic-theme = { git = "https://github.com/pop-os/libcosmic", rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170", default-features = false }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170", default-features = false, features = ["macro"] }
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170", optional = true, features = ["desktop", "single-instance", "wgpu", "xdg-portal"] }

[patch.'https://github.com/pop-os/cosmic-protocols']
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }

[patch.crates-io]
atspi = { git = "https://github.com/wash2/atspi", rev = "e1e6e8bcd781a3155a9ff7e0b1e5193e5587f94c" }
atspi-common = { git = "https://github.com/wash2/atspi", rev = "e1e6e8bcd781a3155a9ff7e0b1e5193e5587f94c" }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

[profile.dev]
debug = 0
